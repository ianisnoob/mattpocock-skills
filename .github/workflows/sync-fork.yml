name: Sync fork with upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/mattpocock/skills.git || true
          git fetch upstream
          BRANCH=$(git remote show upstream | awk '/HEAD branch/{print $NF}')
          git checkout "$BRANCH"
          git merge --ff-only "upstream/$BRANCH" || git merge "upstream/$BRANCH" -m "chore: sync with upstream"
          git push origin "$BRANCH"
